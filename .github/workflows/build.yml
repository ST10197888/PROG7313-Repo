# Name of the workflow (shows in GitHub Actions)
name: Android Build

# When this workflow should run
on:
  push:
    branches:
      - main   # Runs automatically when code is pushed to main branch
  workflow_dispatch:   # Allows you to run it manually from GitHub

# Jobs = main tasks to execute
jobs:
  build:
    name: Build Android App   # Display name in GitHub Actions
    runs-on: ubuntu-latest    # Uses a Linux machine in the cloud

    steps:
      # Step 1: Get your code from the repository
      - name: Checkout project
        uses: actions/checkout@v4

      # Step 2: Install Java (required for Android builds)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu      # Java distribution
          java-version: 17        # Java version used for the project

      # Step 3: Give permission to run Gradle
      - name: Grant execute permission
        run: chmod +x gradlew

      # Step 4: Run unit tests (checks if your code works)
      - name: Run tests
        run: ./gradlew test

      # Step 5: Build the APK (actual Android app file)
      - name: Build APK
        run: ./gradlew assembleDebug
